server.port=8080

# \u2500\u2500 \uC2A4\uD504\uB9C1\uBD80\uD2B8 \uC561\uCE04\uC5D0\uC774\uD0C0 \uC5D4\uB4DC\uD3EC\uC778\uD2B8: \uC7AC\uCD9C \uC804 \uC9C0\uC6B0\uAE30(\uC548\uC9C0\uC6B0\uBA74 \uAD50\uC218\uB2D8\uAF10 \uD63C\uB0A8) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
